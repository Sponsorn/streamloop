[package]
name = "streamloop-ui"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "streamloop_ui"
path = "src/lib.rs"

[[bin]]
name = "streamloop-ui"
path = "src/main.rs"

[dependencies]
# `component` is gpui-component; `assets` is the icon set its controls draw.
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
ureq = { version = "2", default-features = false, features = ["json"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
url = "2"

[dev-dependencies]
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets", "test-support"] }

# Same as the spike and shell/src-tauri, so the exe sizes compare.
[profile.release]
opt-level = "s"
lto = true
strip = true

[workspace]
