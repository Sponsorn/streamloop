[package]
name = "streamloop-pot"
version = "3.0.5"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde_json = "1"
rustypipe-botguard = { path = "vendor/rustypipe-botguard" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "time"] }
