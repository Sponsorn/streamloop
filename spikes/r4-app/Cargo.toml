[package]
name = "r4-app-spike"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "r4app"
path = "src/bin/r4app.rs"

[dependencies]
async-channel = "2"
gpui-kit = { version = "=0.9.0", default-features = false, features = ["component", "assets"] }
tray-icon = { version = "0.24", default-features = false }
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The workspace's release profile, which R4's streamloop.exe builds with.
[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
