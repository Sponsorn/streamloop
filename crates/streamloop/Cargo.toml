[package]
name = "streamloop"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
streamloop-common = { path = "../common" }
streamloop-control = { path = "../control" }
streamloop-supervisor = { path = "../../supervisor" }
streamloop-ui = { path = "../ui" }

[features]
# Broken builds for install-session.mjs's rollback runs, never in a release: supervisor mode, or
# control mode, exits 1 at start.
test-supervisor-fails = []
test-control-fails = []

[dev-dependencies]
serde_json = "1"

[build-dependencies]
# The exe's icon and version resource. Its default feature only reads `package.metadata.winresource`.
winresource = { version = "0.1.34", default-features = false }
