[package]
name = "streamloop-supervisor"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
streamloop-common = { path = "../crates/common" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3.27.0"
